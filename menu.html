<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu | {{cafeName}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="theme-color" content="{{primary}}" />
  <link rel="icon" type="image/png" href="/assets/icon-64.png" />
  <link rel="apple-touch-icon" href="/assets/icon-180.png" />
  <link rel="canonical" href="{{siteUrl}}/menu.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{cafeName}}" />
  <meta property="og:title" content="Menu | {{cafeName}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:image" content="{{siteUrl}}{{ogImage}}" />
  <meta property="og:url" content="{{siteUrl}}/menu.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
  {{{themeStyle}}}
  <script type="module" src="/src/menu-page.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="/" aria-label="{{cafeName}}, home"><img id="logo" src="{{logoWide}}" alt="{{cafeName}}" width="87" height="56" /></a>
    <nav class="nav" aria-label="Main"><a href="/">Home</a><a class="btn primary sm" href="/menu.html" aria-current="page">Menu</a></nav>
  </header>

  <main id="main" tabindex="-1">
    <section class="menu-head">
      <div>
        <h1>Menu</h1>
        <p class="muted">Pick a category, tap an item, choose your size.</p>
      </div>
      <div class="search"><label class="sr" for="q">Search the menu</label><input id="q" type="search" placeholder="Search drinks and food" autocomplete="off" enterkeyhint="search" /></div>
    </section>

    <div class="kiosk">
      <nav class="chips" id="chips" aria-label="Menu categories"><span class="sk-chip" aria-hidden="true"></span><span class="sk-chip" aria-hidden="true"></span><span class="sk-chip" aria-hidden="true"></span><span class="sk-chip" aria-hidden="true"></span><span class="sk-chip" aria-hidden="true"></span><span class="sk-chip" aria-hidden="true"></span></nav>
      <section class="stage" id="menu">
        <div class="stage-head"><h2 id="catTitle"><span class="sk-bar sk-title"></span></h2><p class="muted" id="catSub"></p><p class="sr" id="listStatus" role="status"></p></div>
        <div class="grid" id="grid" aria-busy="true"><span class="sr">Loading menu…</span><div class="sk-card" aria-hidden="true"><span class="sk-img"></span><span class="sk-bar" style="width:70%"></span><span class="sk-bar" style="width:40%"></span></div><div class="sk-card" aria-hidden="true"><span class="sk-img"></span><span class="sk-bar" style="width:70%"></span><span class="sk-bar" style="width:40%"></span></div><div class="sk-card" aria-hidden="true"><span class="sk-img"></span><span class="sk-bar" style="width:70%"></span><span class="sk-bar" style="width:40%"></span></div><div class="sk-card" aria-hidden="true"><span class="sk-img"></span><span class="sk-bar" style="width:70%"></span><span class="sk-bar" style="width:40%"></span></div><div class="sk-card" aria-hidden="true"><span class="sk-img"></span><span class="sk-bar" style="width:70%"></span><span class="sk-bar" style="width:40%"></span></div><div class="sk-card" aria-hidden="true"><span class="sk-img"></span><span class="sk-bar" style="width:70%"></span><span class="sk-bar" style="width:40%"></span></div><div class="sk-card" aria-hidden="true"><span class="sk-img"></span><span class="sk-bar" style="width:70%"></span><span class="sk-bar" style="width:40%"></span></div><div class="sk-card" aria-hidden="true"><span class="sk-img"></span><span class="sk-bar" style="width:70%"></span><span class="sk-bar" style="width:40%"></span></div></div>
        <p class="nomatch muted" id="noMatch" role="status" hidden>No matches. Try another word, like "latte" or "wings".</p>
      </section>
    </div>
  </main>

  <footer class="foot">
    <nav aria-label="Footer"><a href="/menu.html">Menu</a><a href="/#story">Our story</a><a href="/#visit">Find us</a><a href="{{socials.facebook}}" target="_blank" rel="noopener">Facebook</a><a href="{{socials.instagram}}" target="_blank" rel="noopener">Instagram</a><a href="{{socials.tiktok}}" target="_blank" rel="noopener">TikTok</a></nav>
    <p>© {{cafeName}} · {{address}}</p>
  </footer>

  <button id="cartBtn" class="fab" type="button" hidden>
    <span class="fab-l"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>View order <b id="cartCount" class="pill">0</b></span><b id="cartTotal">₱0</b>
  </button>

  <dialog id="item" aria-labelledby="sheetTitle"><div id="itemBody"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="cart" aria-labelledby="cartTitle">
    <div class="dlg-head"><h2 id="cartTitle">Your order</h2><button type="button" id="cartClose" class="icon" aria-label="Close order"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="cartBody"></div>
    <form id="checkout" novalidate hidden>
      <label>Name <input name="name" autocomplete="name" required maxlength="60" aria-describedby="formErr" /></label>
      <fieldset>
        <legend>Order type</legend>
        <label class="radio"><input type="radio" name="type" value="Pickup" checked /> Pickup</label>
        <label class="radio" id="deliveryOpt"><input type="radio" name="type" value="Delivery" /> Delivery</label>
      </fieldset>
      <label id="addrRow" hidden>Delivery address <textarea name="address" rows="2" maxlength="200" autocomplete="street-address" aria-describedby="formErr"></textarea></label>
      <label>Preferred time (optional) <input name="time" placeholder="e.g. 3:00 PM or ASAP" maxlength="40" /></label>
      <label>Note (optional) <textarea name="note" rows="2" maxlength="200" placeholder="Less ice, wing flavor, etc."></textarea></label>
      <p id="hint" class="muted" hidden></p>
      <p id="formErr" class="warn" role="alert" hidden></p>
      <button type="submit" class="btn primary block">Order via Messenger</button>
      <button type="button" id="copyBtn" class="btn block">Copy order</button>
      <p id="after" class="after" role="status" hidden></p>
      <button type="button" id="clearBtn" class="link">Clear cart</button>
    </form>
  </dialog>
</body>
</html>
