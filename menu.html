<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu | {{cafeName}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="theme-color" content="{{primary}}" />
  <link rel="icon" href="{{logo}}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{cafeName}}" />
  <meta property="og:title" content="Menu | {{cafeName}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:image" content="{{siteUrl}}{{ogImage}}" />
  <meta property="og:url" content="{{siteUrl}}/menu.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script type="module" src="/src/menu-page.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="{{cafeName}}, home"><img id="logo" src="{{logoWide}}" alt="{{cafeName}}" width="87" height="56" /></a>
    <nav class="nav" aria-label="Main"><a href="/">Home</a><a class="btn primary sm" href="/menu.html" aria-current="page">Menu</a></nav>
  </header>

  <main id="top">
    <section class="menu-head">
      <h1>Menu</h1>
      <p class="muted">Tap + to add to your order. Prices in ₱.</p>
    </section>

    <nav class="chips" id="chips" aria-label="Menu categories"></nav>
    <section id="menu" class="menu" aria-live="polite"><p class="muted pad">Loading menu…</p></section>
  </main>

  <footer class="foot"><a href="/#visit">Address, hours &amp; contact</a></footer>

  <button id="cartBtn" class="fab" type="button" hidden>
    <span class="fab-l"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>View order <b id="cartCount" class="pill">0</b></span><b id="cartTotal">₱0</b>
  </button>

  <dialog id="cart" aria-labelledby="cartTitle">
    <div class="dlg-head"><h2 id="cartTitle">Your order</h2><button type="button" id="cartClose" class="icon" aria-label="Close order"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="cartBody"></div>
    <form id="checkout" novalidate hidden>
      <label>Name <input name="name" autocomplete="name" required maxlength="60" /></label>
      <fieldset>
        <legend>Order type</legend>
        <label class="radio"><input type="radio" name="type" value="Pickup" checked /> Pickup</label>
        <label class="radio" id="deliveryOpt"><input type="radio" name="type" value="Delivery" /> Delivery</label>
      </fieldset>
      <label id="addrRow" hidden>Delivery address <textarea name="address" rows="2" maxlength="200" autocomplete="street-address"></textarea></label>
      <label>Preferred time (optional) <input name="time" placeholder="e.g. 3:00 PM or ASAP" maxlength="40" /></label>
      <label>Note (optional) <textarea name="note" rows="2" maxlength="200" placeholder="Less ice, wing flavor, etc."></textarea></label>
      <p id="hint" class="muted" hidden></p>
      <p id="formErr" class="warn" role="alert" hidden></p>
      <button type="submit" class="btn primary block">Order via Messenger</button>
      <button type="button" id="copyBtn" class="btn block">Copy order</button>
      <p id="after" class="after" role="status" hidden></p>
      <button type="button" id="clearBtn" class="link">Clear cart</button>
    </form>
  </dialog>
</body>
</html>
